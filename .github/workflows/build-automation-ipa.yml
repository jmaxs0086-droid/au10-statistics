name: Build AU10 automation IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-automation-ipa.yml'
      - 'au10-statistics-main.zip'
      - 'ios-local-app/Web/local-brain.js'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Extract original project
        shell: bash
        run: |
          set -euo pipefail
          test -s au10-statistics-main.zip
          mkdir -p extracted
          unzip -q au10-statistics-main.zip -d extracted
          PROJECT_YML="$(find extracted -path '*/ios-local-app/project.yml' -print -quit)"
          test -n "$PROJECT_YML"
          echo "APP_DIR=$(dirname "$PROJECT_YML")" >> "$GITHUB_ENV"

      - name: Apply screenshot-coordinate automation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$APP_DIR" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          hp = root / "Web/index.html"
          sp = root / "AppDelegate.swift"
          s = hp.read_text(encoding="utf-8")
          # Use the local AHK-style miss-tail queue as the automatic trigger, not fixed manual tails.
          s = s.replace("if(newDraw&&automationRunning&&issueTailMatchesCondition(bettingIssue)&&!alreadyTriggered){",
                        "if(newDraw&&automationRunning&&window.AU10LocalBrain&&window.AU10LocalBrain.canTrigger(bettingIssue)&&!alreadyTriggered){")
          s = s.replace("pendingIssue===bettingIssue&&issueTailMatchesCondition(pendingIssue))",
                        "pendingIssue===bettingIssue&&window.AU10LocalBrain&&window.AU10LocalBrain.canTrigger(pendingIssue))")

          # Keep the Records screen limited to current candidates plus the last 20 hit/miss rows.
          s = s.replace('<th>期号</th><th>实际冠军</th><th>预测号码</th><th>命中状态</th>',
                        '<th>期号</th><th>候选号码</th><th>命中状态</th>')
          s = s.replace("const row='<tr><td>'+esc(target.issue)+'</td><td>'+pad(actual)+'</td><td>'+q.nums.map(pad).join('、')+'</td><td style=\"color:'+(hit?'#86efac':'#fca5a5')+';font-weight:700\">'+(hit?'命中':'未命中')+'</td></tr>';",
                        "const row='<tr><td>'+esc(target.issue)+'</td><td>'+q.nums.map(pad).join('、')+'</td><td style=\"color:'+(hit?'#86efac':'#fca5a5')+';font-weight:700\">'+(hit?'命中':'未命中')+'</td></tr>';")
          s = s.replace('<td colspan="4">历史匹配样本不足，未生成候选号。</td>', '<td colspan="3">历史匹配样本不足，未生成候选号。</td>')
          s = s.replace('<td colspan="4">采集开奖并执行分析后显示</td>', '<td colspan="3">采集开奖并执行分析后显示</td>')
          s = s.replace('<table><thead><tr><th>期号</th><th>实际冠军</th><th>预测号码</th><th>命中状态</th></tr></thead>',
                        '<table><thead><tr><th>期号</th><th>候选号码</th><th>命中状态</th></tr></thead>')
          minimal_records_css = """
          <style id="au10-records-minimal">
          #recordsPanel>h2:first-of-type,#recordsPanel>.actions,#recordsPanel>#status,
          #recordsPanel>h2:nth-of-type(4),#recordsPanel>h2:nth-of-type(5),
          #recordsPanel>p.small,#recordsPanel .tablewrap:has(#historyRows),
          #recordsPanel .metrics:has(#simCount),#recordsPanel .actions:has(#simulateRound),
          #recordsPanel #simStatus,#recordsPanel .tablewrap:has(#simRows){display:none!important}
          #recordsPanel #currentPrediction{margin-bottom:18px}
          #recordsPanel #resultRows tr td{padding:10px 8px}
          </style>
          """
          if 'id="au10-records-minimal"' not in s:
              s = s.replace('</head>', minimal_records_css + '\n</head>', 1)

          old = """    const autoCoordsEnabled=localStorage.getItem(AUTO_COORD_ACTION_KEY)==='1';
              if(autoCoordsEnabled){
               pendingCoordinateAction={issue:pendingIssue,nums:signal.nums.slice()};
               if(handedOff){
                if(coordinateActionTimer)clearTimeout(coordinateActionTimer);
                coordinateActionTimer=setTimeout(()=>{pendingCoordinateAction=null;sendCoordinateAction(pendingIssue,signal.nums,false);},1200);
               }
              }"""
          # Match the original indentation robustly.
          pattern = r"    const autoCoordsEnabled=localStorage\.getItem\(AUTO_COORD_ACTION_KEY\)==='1';\s*if\(autoCoordsEnabled\)\{\s*pendingCoordinateAction=\{issue:pendingIssue,nums:signal\.nums\.slice\(\)\};\s*if\(handedOff\)\{\s*if\(coordinateActionTimer\)clearTimeout\(coordinateActionTimer\);\s*coordinateActionTimer=setTimeout\(\(\)=>\{pendingCoordinateAction=null;sendCoordinateAction\(pendingIssue,signal\.nums,false\);\},1200\);\s*\}\s*\}"
          s, n = re.subn(pattern, """    if(handedOff){
               pendingCoordinateAction={issue:pendingIssue,nums:signal.nums.slice()};
               if(coordinateActionTimer)clearTimeout(coordinateActionTimer);
               coordinateActionTimer=setTimeout(()=>{pendingCoordinateAction=null;sendCoordinateAction(pendingIssue,signal.nums,false);},1200);
              }""", s, count=1)
          if n != 1: raise SystemExit("Could not connect Start/Pause automation to the coordinate action")

          pat = r"function sendCoordinateAction\(issue,nums,manual=false\)\{.*?\n\}\n\$\('autoCoordEnabled'\)"
          fn = """function getAutoBetAmount(issue){
           try{
            const brain=window.AU10LocalBrain;
            if(brain&&typeof brain.setAmounts==='function'&&typeof brain.amount==='function'){
             const settings=readBetSettings();
             if(Array.isArray(settings.tiers)&&settings.tiers.length===4)brain.setAmounts(settings.tiers);
             return String(Math.round(Math.max(0,Number(brain.amount())||0)*100)/100);
            }
           }catch(_){}
           const settings=readBetSettings();
           const tiers=(Array.isArray(settings.tiers)&&settings.tiers.length===4?settings.tiers:[5,15,45,90]).map(Number);
           return String(Math.round(Math.max(0,Number(tiers[0])||0)*100)/100);
          }
          function sendCoordinateAction(issue,nums,manual=false){
           const frame=$('betWebFrame');
           if(!Array.isArray(nums)||nums.length!==6||new Set(nums.map(Number)).size!==6||nums.some(n=>!Number.isInteger(Number(n))||Number(n)<1||Number(n)>10)){$('betWebUrlStatus').textContent='候选号无效，已停止自动操作。';return false;}
           if(!frame||!frame.contentWindow||!betFrameLoaded){$('betWebUrlStatus').textContent='投注网页未加载，自动操作已停止。';return false;}
           const coords={numbers:[[0.291,0.421],[0.486,0.421],[0.679,0.421],[0.874,0.421],[0.292,0.527],[0.486,0.527],[0.679,0.527],[0.873,0.527],[0.291,0.634],[0.486,0.634]],amount:[0.875,0.828],immediate:[0.823,0.924],clear:[0.925,0.233],close:[0.059,0.233],confirm:[0.499,0.941],reset:true};
           const payload={type:'AU10_COORD_ACTION',issue:String(issue||''),nums:nums.map(Number),amount:getAutoBetAmount(issue),coords};
           try{frame.contentWindow.postMessage(payload,'*');$('betWebUrlStatus').textContent='已发送截图坐标自动选号与金额填写序列；最终提交需手动确认。';return true;}catch(e){$('betWebUrlStatus').textContent='坐标操作请求失败：'+(e.message||e);return false;}
          }
          $('autoCoordEnabled')"""
          s, n = re.subn(pat, lambda m: fn, s, count=1, flags=re.S)
          if n != 1: raise SystemExit("Could not replace the old hard-coded screenshot coordinates")

          s = s.replace("$('bottomHome').onclick=()=>showPanel('homePanel');", "$('bottomHome').onclick=()=>setAutomationState(!automationRunning);", 1)
          s = s.replace("const syncBottom=()=>{const toggle=$('bottomToggle');if(toggle){toggle.textContent=automationRunning?'启停：运行中':'启停：暂停';toggle.classList.toggle('danger',automationRunning);}};",
                        "const syncBottom=()=>{const toggle=$('bottomHome');if(toggle){toggle.textContent=automationRunning?'暂停':'启动';toggle.classList.toggle('danger',automationRunning);toggle.classList.toggle('secondary',!automationRunning);}};", 1)
          s = s.replace("for(const key of keys){const el=$(key);if(el)el.style.display=key===id?'block':'none';}",
                        "for(const key of keys){const el=$(key);if(el)el.style.display=key===id?(key==='betWebPanel'?'flex':'block'):'none';}", 1)
          s = s.replace('手动按截图坐标选号、填金额10并打开确认页', '按截图坐标自动操作')
          s = s.replace('③ 金额与下注方式', '② 四个金额档位自定义')
          s = s.replace('① 网页', '① 网页网址')
          s = s.replace('<input id="tier4" type="number" min="0" step="0.1" value="135">', '<input id="tier4" type="number" min="0" step="0.1" value="90">')
          s = s.replace('保存下注方式', '保存四档金额')
          css = """
          <style id="au10-automation-settings-only">
          #settingsPanel .settingsSection:nth-of-type(2),#settingsPanel hr{display:none!important}
          #settingsPanel .settingsSection:first-of-type #runScreenshotCoords,
          #settingsPanel .settingsSection:first-of-type label:has(#autoCoordEnabled),
          #settingsPanel .settingsSection:first-of-type .small{display:none!important}
          #settingsPanel .settingsSection:nth-of-type(3)>p.warning{display:none!important}
          #settingsPanel .settingsSection:nth-of-type(3) .settinggrid>div:not(#tierFields){display:none!important}
          #settingsPanel .settingsSection:nth-of-type(3)>h2{font-size:1.05rem}
          #settingsPanel .settingsSection:nth-of-type(3) #betSettingsStatus{margin-top:8px}
          </style>
          """
          if 'id="au10-automation-settings-only"' not in s:
              s = s.replace('</head>', css + '\n</head>', 1)
          s = s.replace("$('autoCoordEnabled').checked=localStorage.getItem(AUTO_COORD_ACTION_KEY)==='1';", "$('autoCoordEnabled').checked=true;")
          s = s.replace("$('autoCoordEnabled').addEventListener('change',()=>{localStorage.setItem(AUTO_COORD_ACTION_KEY,$('autoCoordEnabled').checked?'1':'0');$('betWebUrlStatus').textContent=$('autoCoordEnabled').checked?'已启用新期开奖自动坐标操作；仅尝试打开最终确认页。':'已关闭新期开奖自动坐标操作。';});",
                        "$('autoCoordEnabled').addEventListener('change',()=>{localStorage.setItem(AUTO_COORD_ACTION_KEY,'1');});")
          s = s.replace('状态：运行中。每 15 秒检查开奖、生成每期六号码模拟记录，并在开奖结算后核对命中；未启用真实投注。',
                        '状态：运行中。每15秒检查开奖；符合条件时按69/70标注位置自动选号、填写金额并打开最终确认页；最终提交由你手动确认。')
          s = s.replace('网页坐标操作仍需手动发起，最终确认投注不会自动点击。', '符合条件的新开奖会触发截图坐标操作；请保持网页布局与标注截图一致。')
          # Bundle the on-device decision core and load it after the existing app script.
          brain = pathlib.Path("/tmp/local-brain.js")
          repo_brain = pathlib.Path.cwd() / "ios-local-app/Web/local-brain.js"
          if not repo_brain.is_file():
              raise SystemExit("Missing iOS local brain module")
          brain_text = repo_brain.read_text(encoding="utf-8")
          if "local-brain.js" not in s:
              s = s.replace("</body>", '<script src="local-brain.js"></script>\n</body>', 1)
          # Show the current four issue-tail queue and active betting tier on the Records screen.
          records_status = """
          <style id="au10-current-bet-status-style">
          #au10-current-bet-status{margin:0 0 14px;padding:12px;border:1px solid #475569;border-radius:12px;background:rgba(30,41,59,.72);color:#f8fafc}
          #au10-current-bet-status .bet-status-title{font-weight:700;margin-bottom:8px}
          #au10-current-bet-status .bet-status-line{font-size:14px;line-height:1.65;overflow-wrap:anywhere}
          #au10-current-bet-status .bet-status-value{font-weight:700;color:#fde68a}
          </style>
          """
          if 'id="au10-current-bet-status-style"' not in s:
              s = s.replace('</head>', records_status + '\n</head>', 1)
          records_script = r"""<script id="au10-records-bet-state">
          (function(){
            function renderAU10BetState(){
              try{
                var panel=document.getElementById('recordsPanel');
                if(!panel)return;
                var anchor=panel.querySelector('#currentPrediction')||panel.querySelector('h2')||panel.firstElementChild||panel;
                var box=document.getElementById('au10-current-bet-status');
                if(!box){
                  box=document.createElement('section');
                  box.id='au10-current-bet-status';
                  box.innerHTML='<div class="bet-status-title">当前下注信息</div><div class="bet-status-line">期号尾数组合：<span class="bet-status-value" id="au10-current-tails">等待计算</span></div><div class="bet-status-line">当前下注档位：<span class="bet-status-value" id="au10-current-tier">等待计算</span></div><div class="bet-status-line">待下注期号：<span id="au10-current-issue">暂无</span></div>';
                  anchor.parentNode.insertBefore(box,anchor);
                }
                var brain=window.AU10LocalBrain;
                var history=[];
                try{if(typeof window.loadSimRounds==='function')history=window.loadSimRounds()||[];}catch(e){}
                var state=brain&&typeof brain.getState==='function'?brain.getState():null;
                if(brain&&typeof brain.buildMissQueue==='function'&&history.length&&(!state||!Array.isArray(state.queue)||state.queue.length===0)){
                  try{brain.buildMissQueue(history);state=brain.getState();}catch(e){}
                }
                var tails=state&&Array.isArray(state.queue)?state.queue.slice(-4):[];
                var tailEl=document.getElementById('au10-current-tails');
                var tierEl=document.getElementById('au10-current-tier');
                var issueEl=document.getElementById('au10-current-issue');
                if(tailEl)tailEl.textContent=tails.length?tails.map(function(n){return String(n);}).join('、'):'暂无可用尾数';
                try{if(typeof window.readBetSettings==='function'&&brain&&typeof brain.setAmounts==='function'){var settings=window.readBetSettings();if(settings&&Array.isArray(settings.tiers)&&settings.tiers.length===4)brain.setAmounts(settings.tiers);}}catch(e){}
                state=brain&&typeof brain.getState==='function'?brain.getState():state;
                var step=state&&Number.isInteger(Number(state.step))?Math.max(1,Math.min(4,Number(state.step))):1;
                var amount=brain&&typeof brain.amount==='function'?brain.amount():((state&&Array.isArray(state.amounts)?state.amounts:[5,15,45,90])[step-1]||0);
                if(tierEl)tierEl.textContent='第'+step+'档（'+String(amount)+'）';
                if(issueEl)issueEl.textContent=state&&state.pendingIssue?String(state.pendingIssue):'等待符合条件的新期';
              }catch(e){}
            }
            renderAU10BetState();
            setInterval(renderAU10BetState,1000);
            document.addEventListener('visibilitychange',renderAU10BetState);
          })();
          </script>"""
          if 'id="au10-records-bet-state"' not in s:
              s = s.replace('</body>', records_script + '\n</body>', 1)
          hp.write_text(s, encoding="utf-8")
          (root / "Web/local-brain.js").write_text(brain_text, encoding="utf-8")

          t = sp.read_text(encoding="utf-8")
          click_pattern = r"const clickAt = \(x,y,label\) => \{\s*x=Number\(x\); y=Number\(y\);.*?el\.click\(\); return el;\s*\};"
          new_click = """                  const clickAt = (x,y,label) => {
                    x=Number(x); y=Number(y);
                    if (Number.isFinite(x)&&Number.isFinite(y)&&x>=0&&x<=1&&y>=0&&y<=1) { x=Math.round(x*Math.max(1,innerWidth-1)); y=Math.round(y*Math.max(1,innerHeight-1)); }
                    if (!Number.isFinite(x)||!Number.isFinite(y)||x<0||y<0||x>=innerWidth||y>=innerHeight) throw new Error(label+'坐标超出当前网页可视区域；已停止，未继续点击');
                    const el=document.elementFromPoint(x,y);
                    if (!el || !el.getClientRects().length) throw new Error(label+'坐标未命中可见网页元素；已停止');
                    el.click(); return el;
                  };"""
          t, n = re.subn(click_pattern, new_click, t, count=1, flags=re.S)
          if n != 1: raise SystemExit("Could not find native coordinate click handler")
          seq_start = t.index("                    let completed=0;")
          seq_end = t.index("                  })();", seq_start)
          new_seq = """                    let completed=0;
                    try {
                      if (coords.reset) {
                        clickAt(coords.immediate?.[0],coords.immediate?.[1],'打开当前投注确认单'); await wait(500);
                        clickAt(coords.clear?.[0],coords.clear?.[1],'清空旧选号'); await wait(300);
                        clickAt(coords.close?.[0],coords.close?.[1],'关闭确认单'); await wait(350);
                      }
                      for (const n of nums) { const point=coords.numbers[n-1]; if (!Array.isArray(point)||point.length<2) throw new Error('号码'+n+'没有配置坐标'); clickAt(point[0],point[1],'号码'+n); completed++; await wait(160); }
                      const amountPoint=coords.amount;
                      const inputEl=clickAt(amountPoint?.[0],amountPoint?.[1],'金额输入框');
                      if (!['INPUT','TEXTAREA'].includes(inputEl.tagName) || inputEl.disabled || inputEl.readOnly) throw new Error('金额坐标没有命中可编辑的金额输入框');
                      inputEl.focus();
                      const value=String(d.amount||'5');
                      const proto=Object.getPrototypeOf(inputEl);
                      const setter=Object.getOwnPropertyDescriptor(proto,'value')?.set;
                      if(setter) setter.call(inputEl,value); else inputEl.value=value;
                      inputEl.dispatchEvent(new Event('input',{bubbles:true})); inputEl.dispatchEvent(new Event('change',{bubbles:true}));
                      await wait(250);
                      if (String(inputEl.value)!==value) throw new Error('金额输入后校验不一致；已停止，未点击下一步');
                      clickAt(coords.immediate?.[0],coords.immediate?.[1],'立即投注/下一步'); await wait(700);
                      const confirmPoint=coords.confirm;
                      if(!Array.isArray(confirmPoint)||confirmPoint.length<2) throw new Error('未配置最终确认按钮坐标；已停止');
                      const px=Math.round(Number(confirmPoint[0])*Math.max(1,innerWidth-1));
                      const py=Math.round(Number(confirmPoint[1])*Math.max(1,innerHeight-1));
                      const hit=document.elementFromPoint(px,py);
                      const confirmEl=hit&&(hit.closest('button,input[type="button"],input[type="submit"],[role="button"],a')||hit);
                      const confirmLabel=String((confirmEl&&(confirmEl.innerText||confirmEl.value||confirmEl.getAttribute('aria-label')||confirmEl.title))||'').replace(/\\\\s+/g,'');
                      const visibleText=String(document.body?.innerText||'').slice(-5000).replace(/\\\\s+/g,'');
                      const modalLikely=/(确认投注|确认下注|投注确认|下注确认)/.test(visibleText);
                      const isVisible=!!(confirmEl&&confirmEl.getClientRects().length&&getComputedStyle(confirmEl).visibility!=='hidden'&&getComputedStyle(confirmEl).display!=='none');
                      const isEnabled=!!(confirmEl&&!confirmEl.disabled&&confirmEl.getAttribute('aria-disabled')!=='true');
                      if(!isVisible||!isEnabled||!modalLikely||!/(确认|投注|下注)/.test(confirmLabel)) throw new Error('未能验证确认页、按钮文字或按钮状态；已停止，未提交');
                      if(window.__au10FinalSubmitInProgress) throw new Error('最终确认已触发，防重复提交保护已阻止再次点击');
                      window.__au10FinalSubmitInProgress=true;
                      try {
                        clickAt(confirmPoint[0],confirmPoint[1],'最终确认投注');
                        report('已自动点击最终确认按钮。请检查网页返回状态与投注记录，不能仅凭点击提示认定订单已成功。');
                      } catch(finalErr) {
                        window.__au10FinalSubmitInProgress=false;
                        throw finalErr;
                      }
                    } catch(err) { report('坐标操作中止（已完成号码点击'+completed+'/6）：'+String(err&&err.message||err)); }"""
          t = t[:seq_start] + new_seq + "\n" + t[seq_end:]
          sp.write_text(t, encoding="utf-8")

          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, re.S|re.I)
          pathlib.Path('/tmp/au10-automation.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert '0.291,0.421' in s and '0.499,0.941' in s
          assert 'const autoCoordsEnabled' not in s
          assert "setAutomationState(!automationRunning)" in s
          assert 'id="au10-automation-settings-only"' in s
          assert '确认投注' in t and 'Number.isFinite(x)' in t
          assert "clickAt(confirmPoint[0],confirmPoint[1],'最终确认投注')" in t
          assert 'window.__au10FinalSubmitInProgress' in t
          assert '已自动点击最终确认按钮' in t
          print('Screenshot-coordinate automation patch verified.')
          PY
          node --check /tmp/au10-automation.js
          node --check "$APP_DIR/Web/local-brain.js"
          grep -q 'id="au10-records-minimal"' "$APP_DIR/Web/index.html"
          grep -q '<th>候选号码</th><th>命中状态</th>' "$APP_DIR/Web/index.html"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and package ad-hoc signed IPA
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          xcodegen generate --spec project.yml
          xcodebuild -project AU10Local.xcodeproj -scheme AU10Local -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name 'AU10Local.app' -path '*/Build/Products/Release-iphoneos/*' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p "$APP_PATH/Web"
          cp "$GITHUB_WORKSPACE/extracted/au10-statistics-main/ios-local-app/Web/index.html" "$APP_PATH/Web/index.html"
          cp "$GITHUB_WORKSPACE/$APP_DIR/Web/local-brain.js" "$APP_PATH/Web/local-brain.js"
          codesign --force --deep --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          mkdir -p "$GITHUB_WORKSPACE/package/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/package/Payload/"
          cd "$GITHUB_WORKSPACE/package"
          zip -qr AU10-Automation-adhoc-signed.ipa Payload
          unzip -t AU10-Automation-adhoc-signed.ipa
          codesign -dv --verbose=2 Payload/AU10Local.app 2>&1 | grep -E 'Signature=adhoc|Identifier=com.jbd0086.au10local'

      - name: Upload automation IPA
        uses: actions/upload-artifact@v4
        with:
          name: AU10-Automation-adhoc-signed-IPA
          path: package/AU10-Automation-adhoc-signed.ipa
          if-no-files-found: error
          retention-days: 30
