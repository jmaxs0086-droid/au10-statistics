name: Build AU10 WKWebView diagnostic IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-diagnostic-ipa.yml'
      - 'au10-statistics-main.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          test -s au10-statistics-main.zip
          mkdir -p extracted
          unzip -q au10-statistics-main.zip -d extracted
          PROJECT_YML="$(find extracted -path '*/ios-local-app/project.yml' -print -quit)"
          HTML="$(find extracted -path '*/ios-local-app/Web/index.html' -print -quit)"
          test -n "$PROJECT_YML"
          test -n "$HTML"
          echo "APP_DIR=$(dirname "$PROJECT_YML")" >> "$GITHUB_ENV"
          echo "HTML_PATH=$HTML" >> "$GITHUB_ENV"

      - name: Patch to diagnostic-only behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$HTML_PATH" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          original = s

          # Keep the original coordinate controls and handlers in the DOM so the
          # existing local calculation and automation code are not disconnected.
          # Hide only the extra controls visually; the Start/Pause button remains the entry point.

          # Bottom-most controls: Start/Pause, Web, Records.
          s = s.replace('grid-template-columns:repeat(4,minmax(0,1fr))', 'grid-template-columns:repeat(3,minmax(0,1fr))')
          s = s.replace('<button id="bottomHome" type="button" class="secondary">主页</button>', '<button id="bottomHome" type="button" class="secondary">启动</button>')
          s = s.replace('<button id="bottomSettings" type="button" class="secondary">设置</button>', '')
          s = s.replace("$('bottomHome').onclick=()=>showPanel('homePanel');", "$('bottomHome').onclick=()=>setAutomationState(!automationRunning);")
          s = s.replace(" $('bottomSettings').onclick=()=>showPanel('settingsPanel');", "")
          s = s.replace("const syncBottom=()=>{const toggle=$('bottomToggle');if(toggle){toggle.textContent=automationRunning?'启停：运行中':'启停：暂停';toggle.classList.toggle('danger',automationRunning);}};",
                        "const syncBottom=()=>{const toggle=$('bottomHome');if(toggle){toggle.textContent=automationRunning?'暂停':'启动';toggle.classList.toggle('danger',automationRunning);toggle.classList.toggle('secondary',!automationRunning);}};")
          # Preserve legacy data nodes hidden, while showing only the current candidate and hit table.
          s = re.sub(r'(<section id="recordsPanel"[^>]*>)(.*?)(</section>)',
                     lambda m: m.group(1) + '<div style="display:none">' +
                     m.group(2)[:m.group(2).find('<h2>当前期候选号码</h2>')] +
                     '</div>' +
                     m.group(2)[m.group(2).find('<h2>当前期候选号码</h2>'):m.group(2).find('<h2>本机历史记录</h2>')] +
                     '<div style="display:none">' +
                     m.group(2)[m.group(2).find('<h2>本机历史记录</h2>'):] +
                     '</div>' + m.group(3), s, count=1, flags=re.S)
          if 'id="bottomSettings"' in s:
              raise SystemExit("Settings navigation button was not removed")
          if 'grid-template-columns:repeat(3,minmax(0,1fr))' not in s:
              raise SystemExit("Could not update bottom navigation layout")

          # Fix mismatch: predictAt() requires 288 real history rows, not 25.
          s = s.replace('采集至少 25 期有效开奖历史后，点击“执行分析”生成下一期候选号。',
                        '采集至少 288 期有效开奖历史后，系统才会生成当前期候选号。', 1)
          old_guard = "if(rows.length<25){"
          if old_guard not in s:
              raise SystemExit("Could not find local analysis history guard")
          s = s.replace(old_guard, "if(rows.length<288){", 1)
          s = s.replace("主预测需要至少 25 期有效开奖记录", "本地策略需要至少 288 期有效开奖记录", 1)
          # Guard against a null prediction result before rendering candidate numbers.
          old_render = "  const current=predictAt(rows,false);\n  const last=rows[rows.length-1];"
          new_render = "  const current=predictAt(rows,false);\n  if(!current||!Array.isArray(current.nums)||current.nums.length!==6){if(currentBox)currentBox.textContent='本地计算未返回有效的六个候选号。';say('本地计算未返回有效结果；未生成候选号。');return;}\n  const last=rows[rows.length-1];"
          if old_render in s:
              s = s.replace(old_render, new_render, 1)
          else:
              raise SystemExit("Could not find local prediction render point")

          # Make the existing bottom-control row fixed to the viewport and safe-area aware.
          # The original controls/handlers remain present; no local calculation function is replaced.
          footer_patch = r"""
          <style id="au10-fixed-bottom-controls">
          body { padding-bottom: calc(84px + env(safe-area-inset-bottom)) !important; }
          #bottomHome, #bottomBet, #bottomRecords { min-height: 44px; touch-action: manipulation; }
          label:has(#autoCoordEnabled), #runScreenshotCoords { display: none !important; }
          </style>
          <script id="au10-bottom-control-fallback">
          (function(){
            function install(){
              var home=document.getElementById('bottomHome');
              if(!home || !home.parentElement) return;
              var bar=home.parentElement;
              bar.style.position='fixed';
              bar.style.left='0';
              bar.style.right='0';
              bar.style.bottom='0';
              bar.style.zIndex='2147483000';
              bar.style.display='grid';
              bar.style.gridTemplateColumns='repeat(3,minmax(0,1fr))';
              bar.style.gap='8px';
              bar.style.padding='8px 12px calc(8px + env(safe-area-inset-bottom))';
              bar.style.background='rgba(20,20,20,.96)';
              bar.style.boxSizing='border-box';
              bar.style.width='100%';
              document.addEventListener('click',function(e){
                var b=e.target && e.target.closest ? e.target.closest('#bottomHome,#bottomBet,#bottomRecords') : null;
                if(!b) return;
                if(b.id==='bottomHome'){
                  if(typeof window.setAutomationState!=='function') return;
                  e.preventDefault();
                  e.stopImmediatePropagation();
                  var start=b.textContent.trim()==='启动' || b.textContent.trim()==='开始';
                  window.setAutomationState(start);
                } else {
                  if(typeof window.showPanel!=='function') return;
                  e.preventDefault();
                  e.stopImmediatePropagation();
                  var panel=b.id==='bottomBet'?'betWebPanel':'recordsPanel';
                  window.showPanel(panel);
                }
              },true);
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install,{once:true});
            else install();
          })();
          </script>
          """
          if 'id="au10-fixed-bottom-controls"' not in s:
              if '</head>' in s:
                  s = s.replace('</head>', footer_patch + '\n</head>', 1)
              else:
                  s = footer_patch + s

          # Add a separate local-only four-tail progression tracker. It never submits orders.
          strategy_patch = r'''<script id="au10-four-tail-simulation">
          (function(){
            const KEY='au10_four_tail_simulation_v1';
            const amounts=[5,15,45,90];
            function loadState(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||{combo:[],step:0,records:[],lastSettledIssue:'',status:'尚未生成组合'};}catch(_){return {combo:[],step:0,records:[],lastSettledIssue:'',status:'尚未生成组合'};}}
            let state=loadState();
            function save(){localStorage.setItem(KEY,JSON.stringify(state));render();}
            function tail(issue){const s=String(issue||'').trim();return /^\d+$/.test(s)?Number(s.slice(-1)):null;}
            function brain(){try{const p=predictAt(rows,false);return p&&Array.isArray(p.nums)&&p.nums.length===6?p.nums:null;}catch(_){return null;}}
            function selectCombo(){
              const ordered=rows.slice().sort((a,b)=>String(a.issue).localeCompare(String(b.issue),undefined,{numeric:true}));
              if(ordered.length<289)return {combo:[],window:20,reason:'需要至少 289 期真实记录，才能用本地大脑核对最近期的六号码命中状态'};
              for(const windowSize of [10,20]){
                const recent=ordered.slice(-windowSize);
                const found=[]; const seen=new Set();
                for(let i=recent.length-1;i>=0;i--){
                  const target=recent[i]; const idx=ordered.findIndex(x=>String(x.issue)===String(target.issue));
                  if(idx<288)continue;
                  const p=predictAt(ordered.slice(0,idx),true);
                  if(!p||!Array.isArray(p.nums)||p.nums.length!==6||p.nums.includes(Number(target.champion)))continue;
                  const t=tail(target.issue);if(t===null||seen.has(t))continue;
                  seen.add(t);found.push({tail:t,issue:String(target.issue)});
                  if(found.length===4)break;
                }
                if(found.length===4)return {combo:found.reverse(),window:windowSize,reason:''};
              }
              return {combo:[],window:20,reason:'最近 20 期内不足 4 个互不重复、且本地六号码预测未命中的期号尾数'};
            }
            function generate(){
              const result=selectCombo();
              if(result.combo.length!==4){state.status=result.reason;save();return;}
              state.combo=result.combo;state.step=0;state.status='新组合已生成；按旧到新顺序等待目标期号尾数';
              state.records.push({time:new Date().toISOString(),type:'新组合',window:result.window,combo:result.combo.map(x=>x.tail),issues:result.combo.map(x=>x.issue),nums:brain(),amount:null,result:'待开始'});
              if(state.records.length>100)state.records=state.records.slice(-100);
              save();
            }
            function settleLatest(){
              if(!Array.isArray(rows)||rows.length<289||state.combo.length!==4||state.step>=4)return;
              const ordered=rows.slice().sort((a,b)=>String(a.issue).localeCompare(String(b.issue),undefined,{numeric:true}));
              const latest=ordered[ordered.length-1];
              if(!latest||String(latest.issue)===state.lastSettledIssue)return;
              const t=tail(latest.issue), target=state.combo[state.step];
              if(t===null||!target||t!==target.tail)return;
              const p=predictAt(ordered.slice(0,-1),true);
              if(!p||!Array.isArray(p.nums)||p.nums.length!==6)return;
              const hit=p.nums.includes(Number(latest.champion));
              state.records.push({time:new Date().toISOString(),type:'模拟结算',issue:String(latest.issue),tail:t,amount:amounts[state.step],nums:p.nums,actual:Number(latest.champion),result:hit?'命中':'未命中'});
              state.lastSettledIssue=String(latest.issue);
              if(hit){state.status='本档命中；重新筛选四个尾数组合';const result=selectCombo();if(result.combo.length===4){state.combo=result.combo;state.step=0;state.status='命中后已重置：新组合从 5 开始';state.records.push({time:new Date().toISOString(),type:'命中后重选',window:result.window,combo:result.combo.map(x=>x.tail),issues:result.combo.map(x=>x.issue),nums:brain(),amount:null,result:'从 5 开始'});}else{state.combo=[];state.step=0;state.status=result.reason;}}
              else if(state.step===3){state.status='四档均未命中；重新筛选组合并从 5 开始';const result=selectCombo();if(result.combo.length===4){state.combo=result.combo;state.step=0;state.status='四档未中后已重置：新组合从 5 开始';state.records.push({time:new Date().toISOString(),type:'四档未中重选',window:result.window,combo:result.combo.map(x=>x.tail),issues:result.combo.map(x=>x.issue),nums:brain(),amount:null,result:'从 5 开始'});}else{state.combo=[];state.step=0;state.status=result.reason;}}
              else {state.step++;state.status='本档未命中；等待下一个筛选尾数，模拟金额 '+amounts[state.step]+'（不提交真实订单）';}
              if(state.records.length>100)state.records=state.records.slice(-100);save();
            }
            function render(){
              let box=document.getElementById('au10FourTailBox');if(!box){const panel=document.getElementById('recordsPanel');if(!panel)return;box=document.createElement('div');box.id='au10FourTailBox';box.className='status';box.style.marginTop='12px';const current=document.getElementById('currentPrediction');if(current&&current.parentElement)current.parentElement.insertBefore(box,current.nextSibling);else panel.prepend(box);}
              const combo=state.combo.length?state.combo.map((x,i)=>'第'+(i+1)+'档：尾数 '+x.tail+'（历史期号 '+x.issue+'）— 模拟金额 '+amounts[i]).join('<br>'):'暂无有效四尾数组合';
              const logs=state.records.slice(-8).reverse().map(x=>{const title=x.type==='模拟结算'?'期号 '+(x.issue||'—')+' / 尾数 '+(x.tail??'—')+' / '+(x.amount??'—')+' / '+(x.result||''):x.type+'：'+(x.combo?x.combo.join('、'):'')+' '+(x.result||'');return '<div>'+title+'</div>';}).join('');
              box.innerHTML='<strong>四尾数策略（仅本地模拟，不提交订单）</strong><br>'+state.status+'<br><br>'+combo+'<br><br><button type="button" id="au10FourTailGenerate">重新筛选四个尾数</button> <button type="button" id="au10FourTailReset">重置模拟进度</button><hr><strong>最近模拟记录</strong><br>'+(logs||'暂无记录');
              const g=document.getElementById('au10FourTailGenerate'),r=document.getElementById('au10FourTailReset');if(g)g.onclick=generate;if(r)r.onclick=()=>{state={combo:[],step:0,records:[],lastSettledIssue:'',status:'模拟进度已重置'};save();};
            }
            function refresh(){if(!state.combo.length)generate();else{settleLatest();render();}}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',refresh,{once:true});else refresh();
            const oldAnalyze=window.analyze; if(typeof oldAnalyze==='function')window.analyze=function(){oldAnalyze();refresh();};
            const oldLatest=window.latest; if(typeof oldLatest==='function')window.latest=function(){const v=oldLatest();Promise.resolve(v).finally(refresh);return v;};
          })();
          </script>'''
          if 'id="au10-four-tail-simulation"' not in s:
              s = s.replace('</body>', strategy_patch + '\\n</body>', 1)
          if 'id="au10-four-tail-simulation"' not in s:
              raise SystemExit("Could not insert local four-tail simulation tracker")

          # Do not rewrite sendCoordinateAction or the local prediction/calculation routines.

          if s == original:
              raise SystemExit("No source changes detected; refusing to package")
          p.write_text(s, encoding="utf-8")
          print("Patched diagnostic-only HTML:", p)
          PY

          python3 - "$HTML_PATH" <<'PY'
          import pathlib, re, sys
          s = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          assert 'id="au10-fixed-bottom-controls"' in s
          assert '本地策略需要至少 288 期有效开奖记录' in s
          assert 'if(rows.length<288){' in s
          assert '本地计算未返回有效的六个候选号' in s
          assert 'id="au10-bottom-control-fallback"' in s
          assert "sendCoordinateAction" in s
          assert "AU10_COORD_ACTION_DISABLED" not in s
          assert s.count("applyBetWebUrl();") >= 2
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, re.S|re.I)
          pathlib.Path("/tmp/au10-diagnostic.js").write_text("\n".join(scripts), encoding="utf-8")
          print("Validated local coordinate-action code is preserved; bottom controls are fixed.")
          PY
          node --check /tmp/au10-diagnostic.js

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          xcodegen generate --spec project.yml
          xcodebuild -project AU10Local.xcodeproj -scheme AU10Local -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name 'AU10Local.app' -path '*/Build/Products/Release-iphoneos/*' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p "$APP_PATH/Web"
          cp "$GITHUB_WORKSPACE/$HTML_PATH" "$APP_PATH/Web/index.html"
          test -s "$APP_PATH/Web/index.html"
          mkdir -p "$GITHUB_WORKSPACE/package/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/package/Payload/"
          test -s "$GITHUB_WORKSPACE/package/Payload/AU10Local.app/Web/index.html"
          cd "$GITHUB_WORKSPACE/package"
          zip -qr AU10Diagnostic-unsigned.ipa Payload
          unzip -t AU10Diagnostic-unsigned.ipa

      - name: Upload IPA and patched HTML
        uses: actions/upload-artifact@v4
        with:
          name: AU10Diagnostic-unsigned-IPA
          path: |
            package/AU10Diagnostic-unsigned.ipa
            ${{ env.HTML_PATH }}
          if-no-files-found: error
          retention-days: 30
